[project]
name = "bookextractor"
version = "0.1.0"
description = "Extract structured metadata from scanned Telugu/Hindi/English PDFs"
authors = [
    { name = "name", email = "name@example.com" }
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pymupdf>=1.22.0",
    "easyocr>=1.7.0",
    "pillow>=9.5.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    "vllm>=0.19.0",
    "transformers>=5.5.0",
    "huggingface_hub>=0.21.0",
    "typer>=0.9.0",
    "python-multipart>=0.0.6",
    "numpy>=1.24.0",
    "opencv-python-headless>=4.7.0",
    "nvidia-ml-py>=12.535.133",
    "psutil>=5.9.0",
    "questionary>=2.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "vulture>=2.0",
    "requests>=2.31.0",
    "piexif>=1.1.3",
    "pytest-httpx>=0.36.2",
    "pytest-mock>=1.15.0",
    "pytest-asyncio>=0.21.0",
    "pytest-httpx>=0.36.2",
    "celery>=5.3.0",
    "redis>=5.0.0",
    "flower>=2.0.0",
]
requires-python = ">=3.10"

[project.scripts]
bookextractor = "bookextractor.main:cli_app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bookextractor"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=bookextractor --cov-report=term-missing"
asyncio_mode = "auto"

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

[dependency-groups]
dev = []
