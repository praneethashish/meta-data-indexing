stages:
  - lint
  - format
  - type-check
  - test
  - build

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  # Disable project installation for quality stages to save time
  UV_NO_INSTALL_PROJECT: "1"

# Global cache for uv and mypy
cache:
  key:
    files:
      - uv.lock
  paths:
    - .cache/uv
    - .venv/
    - .mypy_cache/

.setup_uv: &setup_uv
  image: ghcr.io/astral-sh/uv:python3.10-bookworm-slim
  before_script:
    - uv sync --frozen

ruff-lint:
  <<: *setup_uv
  stage: lint
  script:
    - uv run ruff check .
    - uv run vulture bookextractor/
  only:
    changes:
      - "**/*.py"
      - ".gitlab-ci.yml"
      - "pyproject.toml"
      - "uv.lock"

ruff-format:
  <<: *setup_uv
  stage: format
  script:
    - uv run ruff format --check .
  only:
    changes:
      - "**/*.py"
      - ".gitlab-ci.yml"
      - "pyproject.toml"
      - "uv.lock"

type-check:
  <<: *setup_uv
  stage: type-check
  script:
    - uv run mypy bookextractor/
  only:
    changes:
      - "**/*.py"
      - ".gitlab-ci.yml"
      - "pyproject.toml"
      - "uv.lock"

pytest:
  <<: *setup_uv
  stage: test
  variables:
    UV_NO_INSTALL_PROJECT: "0" # Re-enable for testing
  script:
    - uv sync --frozen --extra ml --group test
    - uv run pytest tests/ --cov=bookextractor --cov-report=term --cov-report=xml --cov-fail-under=90
  coverage: '/TOTAL.*\s+(\d+%)$/'
  only:
    changes:
      - "**/*.py"
      - ".gitlab-ci.yml"
      - "pyproject.toml"
      - "uv.lock"
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

docker-build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build .
  only:
    - main
