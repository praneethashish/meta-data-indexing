stages:
  - lint
  - test
  - build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip
    - .venv/

lint:
  stage: lint
  image: python:3.10
  before_script:
    - pip install ruff
  script:
    - ruff check .

# Note: Tests requiring the LLM/GGUF model would need 
# a runner with GPU/sufficient RAM and the model cached.
test:
  stage: test
  image: python:3.10
  before_script:
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - source $HOME/.cargo/env
    - uv venv
    - source .venv/bin/activate
    - uv pip install -e .
  script:
    - python -m pytest tests/
  only:
    - merge_requests
    - main

docker-build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build .
  only:
    - main
