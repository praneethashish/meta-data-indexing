stages:
  - lint
  - format
  - type-check
  - test
  - build

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"

cache:
  key:
    files:
      - uv.lock
  paths:
    - .cache/uv
    - .venv/

.setup_uv: &setup_uv
  image: python:3.10-slim
  before_script:
    - apt-get update && apt-get install -y curl git
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - source $HOME/.local/bin/env

ruff-lint:
  <<: *setup_uv
  stage: lint
  script:
    - uv sync --frozen --no-default-groups --group lint
    - uv run ruff check .
  only:
    changes:
      - "**/*.py"
      - ".gitlab-ci.yml"
      - "pyproject.toml"
      - "uv.lock"

ruff-format:
  <<: *setup_uv
  stage: format
  script:
    - uv sync --frozen --no-default-groups --group lint
    - uv run ruff format --check .
  only:
    changes:
      - "**/*.py"
      - ".gitlab-ci.yml"
      - "pyproject.toml"
      - "uv.lock"

type-check:
  <<: *setup_uv
  stage: type-check
  script:
    - uv sync --frozen --no-default-groups --group lint
    - uv run mypy bookextractor/
  only:
    changes:
      - "**/*.py"
      - ".gitlab-ci.yml"
      - "pyproject.toml"
      - "uv.lock"

vulture-dead-code:
  <<: *setup_uv
  stage: lint
  script:
    - uv sync --frozen --no-default-groups --group lint
    - uv run vulture bookextractor/
  only:
    changes:
      - "**/*.py"
      - ".gitlab-ci.yml"
      - "pyproject.toml"
      - "uv.lock"

pytest:
  <<: *setup_uv
  stage: test
  script:
    - uv sync --frozen --extra ml --group test
    - uv run pytest tests/ --cov=bookextractor --cov-report=term --cov-report=xml --cov-fail-under=90
  coverage: '/TOTAL.*\s+(\d+%)$/'
  only:
    changes:
      - "**/*.py"
      - ".gitlab-ci.yml"
      - "pyproject.toml"
      - "uv.lock"
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

docker-build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build .
  only:
    - main
