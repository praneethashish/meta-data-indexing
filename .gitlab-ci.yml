stages:
  - lint
  - format
  - type-check
  - test
  - build

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  # Ensures uv doesn't try to build the project wheel during linting
  UV_NO_INSTALL_PROJECT: "1"

cache:
  key:
    files:
      - uv.lock
  paths:
    - .cache/uv
    - .venv/
    - .mypy_cache/

.setup_uv: &setup_uv
  image: ghcr.io/astral-sh/uv:python3.10-bookworm-slim

ruff-lint:
  <<: *setup_uv
  stage: lint
  script:
    - uv run --group lint ruff check .
    - uv run --group lint vulture metaextractor/
  only:
    changes: &changes_filter
      - "**/*.py"
      - ".gitlab-ci.yml"
      - "pyproject.toml"
      - "uv.lock"

ruff-format:
  <<: *setup_uv
  stage: format
  script:
    - uv run --group lint ruff format --check .
  only:
    changes: *changes_filter

type-check:
  <<: *setup_uv
  stage: type-check
  script:
    - uv run --group lint mypy metaextractor/
  only:
    changes: *changes_filter

pytest:
  <<: *setup_uv
  stage: test
  variables:
    UV_NO_INSTALL_PROJECT: "0"
  script:
    - uv run --extra ml --group test pytest tests/ --cov=metaextractor --cov-report=term --cov-report=xml --cov-fail-under=90
  coverage: '/TOTAL.*\s+(\d+%)$/'
  only:
    changes: *changes_filter
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

docker-build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE:latest -f Dockerfile.metaextractor .
    - docker push $CI_REGISTRY_IMAGE:latest
  only:
    - main
