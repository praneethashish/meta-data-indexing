repos:
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.3.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-json
        stages: [pre-commit]
      - id: pretty-format-json
        args: ['--no-sort-keys']
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        stages: [pre-commit]
      - id: ruff-format
        args: ['--check']
        stages: [pre-commit]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
        stages: [pre-commit]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        exclude: ^(tests/)
        additional_dependencies: [
          "pydantic>=2.0.0",
          "fastapi>=0.100.0",
          "types-Pillow",
          "types-requests"
        ]
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: vulture
        name: vulture
        entry: uv run vulture
        language: system
        types: [python]
        pass_filenames: false
        args: ["bookextractor/", "--min-confidence", "80"]
        stages: [pre-commit]

      - id: pytest-cov
        name: pytest coverage
        entry: uv run pytest tests/ --cov=bookextractor --cov-report=term-missing --cov-fail-under=95
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
