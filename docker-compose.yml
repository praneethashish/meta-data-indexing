services:
  bookextractor:
    build:
      context: .
      dockerfile: Dockerfile.bookextractor
    image: bookextractor:latest
    ports:
      - "8000:8000"
    environment:
      - VPARSE_API_URL=http://vparse:8000/file_parse
      - HF_HOME=/models/huggingface
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - BOOKEXTRACTOR_UPLOAD_DIR=/app/uploads
    volumes:
      - ~/.cache/huggingface:/models/huggingface
      - models:/models
      - ./uploads:/app/uploads
    depends_on:
      model-downloader:
        condition: service_completed_successfully
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  worker-cpu:
    build:
      context: .
      dockerfile: Dockerfile.bookextractor
    image: bookextractor:latest
    command: bookextractor worker --queue default_queue --concurrency 8
    environment:
      - VPARSE_API_URL=http://vparse:8000/file_parse
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - BOOKEXTRACTOR_UPLOAD_DIR=/app/uploads
      - HF_HOME=/models/huggingface
    volumes:
      - ~/.cache/huggingface:/models/huggingface
      - models:/models
      - ./uploads:/app/uploads
    depends_on:
      model-downloader:
        condition: service_completed_successfully
      redis:
        condition: service_started

  worker-gpu:
    build:
      context: .
      dockerfile: Dockerfile.bookextractor
    image: bookextractor:latest
    command: bookextractor worker --queue vlm_queue --concurrency 2
    environment:
      - VLLM_MODEL=${VLLM_MODEL_ID:-Qwen/Qwen2.5-VL-7B-Instruct}
      - VLLM_TENSOR_PARALLEL_SIZE=1
      - HF_HOME=/models/huggingface
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - BOOKEXTRACTOR_UPLOAD_DIR=/app/uploads
    volumes:
      - ~/.cache/huggingface:/models/huggingface
      - models:/models
      - ./uploads:/app/uploads
    depends_on:
      model-downloader:
        condition: service_completed_successfully
      redis:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  model-downloader:
    build:
      context: .
      dockerfile: Dockerfile.model-downloader
    volumes:
      - ~/.cache/huggingface:/models/huggingface
      - models:/models
      - ./scripts/setup_models.py:/app/setup_models.py
    environment:
      - VLLM_MODEL_ID=${VLLM_MODEL_ID:-Qwen/Qwen2.5-VL-7B-Instruct}
      - HF_HOME=/models/huggingface
    command: python -u /app/setup_models.py

  # ---------------------------------------------------------
  # VParse Services (Optional, started via profiles)
  # Build directly from Git: https://github.com/suryamanoj4/mineru-dots.git
  # ---------------------------------------------------------

  vparse-pipeline:
    profiles: ["pipeline"]
    build:
      context: https://github.com/suryamanoj4/mineru-dots.git#main
      dockerfile: docker/global/Dockerfile.cpu
    image: vparse:pipeline
    networks:
      default:
        aliases:
          - vparse
    ports:
      - "9000:8000"
    environment:
      - VPARSE_MODEL_SOURCE=huggingface
      - VPARSE_PREFETCH_MODELS=pipeline
      - MODELSCOPE_CACHE=/models/modelscope
      - HF_HOME=/models/huggingface
    volumes:
      - ~/.cache/huggingface:/models/huggingface
      - models:/models
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    entrypoint:
      - python3
      - /app/docker/global/start-with-models.py
    command:
      - vparse-api
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    depends_on:
      model-downloader:
        condition: service_completed_successfully

  vparse-vlm:
    profiles: ["vlm"]
    build:
      context: https://github.com/suryamanoj4/mineru-dots.git#main
      dockerfile: docker/global/Dockerfile
    image: vparse:vlm
    networks:
      default:
        aliases:
          - vparse
    ports:
      - "9000:8000"
    environment:
      - VPARSE_MODEL_SOURCE=huggingface
      - VPARSE_PREFETCH_MODELS=vlm
      - MODELSCOPE_CACHE=/models/modelscope
      - HF_HOME=/models/huggingface
    volumes:
      - ~/.cache/huggingface:/models/huggingface
      - models:/models
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    entrypoint:
      - python3
      - /app/docker/global/start-with-models.py
    command:
      - vparse-api
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --gpu-memory-utilization
      - "0.5"
    depends_on:
      model-downloader:
        condition: service_completed_successfully
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

  vparse-hybrid:
    profiles: ["hybrid"]
    build:
      context: https://github.com/suryamanoj4/mineru-dots.git#main
      dockerfile: docker/global/Dockerfile
    image: vparse:hybrid
    networks:
      default:
        aliases:
          - vparse
    ports:
      - "9000:8000"
    environment:
      - VPARSE_MODEL_SOURCE=huggingface
      - VPARSE_PREFETCH_MODELS=all
      - MODELSCOPE_CACHE=/models/modelscope
      - HF_HOME=/models/huggingface
    volumes:
      - ~/.cache/huggingface:/models/huggingface
      - models:/models
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    entrypoint:
      - python3
      - /app/docker/global/start-with-models.py
    command:
      - vparse-api
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --gpu-memory-utilization
      - "0.5"
    depends_on:
      model-downloader:
        condition: service_completed_successfully
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

volumes:
  models:
    name: models
