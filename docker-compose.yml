services:
  bookextractor:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Persist downloaded models in the repository-local models directory.
      - ./models:/app/models
      # Persist EasyOCR cache between runs without hardcoding a user home path.
      - easyocr-cache:/root/.EasyOCR
    environment:
      - VLM_MODEL_PATH=/app/models/gemma-4-E4B-it-Q4_K_M.gguf
    restart: unless-stopped

volumes:
  easyocr-cache:
