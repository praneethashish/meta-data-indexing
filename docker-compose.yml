services:
  bookextractor:
    build:
      context: .
      dockerfile: Dockerfile.bookextractor
    image: bookextractor:latest
    ports:
      - "8000:8000"
    environment:
      - VPARSE_API_URL=http://vparse:8000
    volumes:
      - models:/models
    depends_on:
      - vparse

  vparse:
    build:
      context: .
      dockerfile: ${VPARSE_DOCKERFILE:-Dockerfile.vparse}   # default: pipeline/paddle
    image: vparse:latest
    ports:
      - "9000:8000"   # Host 9000 → container 8000
    volumes:
      - models:/models

volumes:
  models:
    name: models   # Persistent volume for downloaded model files
