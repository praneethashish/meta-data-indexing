services:
  bookextractor:
    build:
      context: .
      dockerfile: Dockerfile.bookextractor
    image: bookextractor:latest
    ports:
      - "8000:8000"
    environment:
      - VPARSE_API_URL=http://vparse:8000/file_parse
      - VLLM_MODEL=/models/vllm/google/gemma-4-E4B-it
      - VLLM_TENSOR_PARALLEL_SIZE=1
      - HF_HOME=/models/huggingface
    volumes:
      - models:/models
    depends_on:
      model-downloader:
        condition: service_completed_successfully
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  model-downloader:
    build:
      context: .
      dockerfile: Dockerfile.model-downloader
    volumes:
      - models:/models
      - ./scripts/setup_models.py:/app/setup_models.py
    environment:
      - VLLM_MODEL_ID=google/gemma-4-E4B-it
      - VLLM_MODEL_PATH=/models/vllm/google/gemma-4-E4B-it
      - MODELSCOPE_CACHE=/models/modelscope
      - HF_HOME=/models/huggingface
    command: python -u /app/setup_models.py

  # ---------------------------------------------------------
  # VParse Services (Optional, started via profiles)
  # Build directly from Git: https://github.com/suryamanoj4/mineru-dots.git
  # ---------------------------------------------------------

  vparse-pipeline:
    profiles: ["pipeline"]
    build:
      context: https://github.com/suryamanoj4/mineru-dots.git#main
      dockerfile: docker/global/Dockerfile.cpu
    image: vparse:pipeline
    networks:
      default:
        aliases:
          - vparse
    ports:
      - "9000:8000"
    environment:
      - VPARSE_MODEL_SOURCE=huggingface
      - VPARSE_PREFETCH_MODELS=pipeline
      - MODELSCOPE_CACHE=/models/modelscope
      - HF_HOME=/models/huggingface
    volumes:
      - models:/models
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    entrypoint:
      - python3
      - /app/docker/global/start-with-models.py
    command:
      - vparse-api
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    depends_on:
      model-downloader:
        condition: service_completed_successfully

  vparse-vlm:
    profiles: ["vlm"]
    build:
      context: https://github.com/suryamanoj4/mineru-dots.git#main
      dockerfile: docker/global/Dockerfile
    image: vparse:vlm
    networks:
      default:
        aliases:
          - vparse
    ports:
      - "9000:8000"
    environment:
      - VPARSE_MODEL_SOURCE=huggingface
      - VPARSE_PREFETCH_MODELS=vlm
      - MODELSCOPE_CACHE=/models/modelscope
      - HF_HOME=/models/huggingface
    volumes:
      - models:/models
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    entrypoint:
      - python3
      - /app/docker/global/start-with-models.py
    command:
      - vparse-api
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --gpu-memory-utilization
      - "0.5"
    depends_on:
      model-downloader:
        condition: service_completed_successfully
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

  vparse-hybrid:
    profiles: ["hybrid"]
    build:
      context: https://github.com/suryamanoj4/mineru-dots.git#main
      dockerfile: docker/global/Dockerfile
    image: vparse:hybrid
    networks:
      default:
        aliases:
          - vparse
    ports:
      - "9000:8000"
    environment:
      - VPARSE_MODEL_SOURCE=huggingface
      - VPARSE_PREFETCH_MODELS=all
      - MODELSCOPE_CACHE=/models/modelscope
      - HF_HOME=/models/huggingface
    volumes:
      - models:/models
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    entrypoint:
      - python3
      - /app/docker/global/start-with-models.py
    command:
      - vparse-api
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --gpu-memory-utilization
      - "0.5"
    depends_on:
      model-downloader:
        condition: service_completed_successfully
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

volumes:
  models:
    name: models
